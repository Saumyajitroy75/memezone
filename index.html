<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meme Zone — Laugh & Scroll</title>
  <meta name="description" content="A lightweight meme gallery. Scroll to load more memes.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Meme Zone</h1>
    <div class="header-actions">
      <button id="toggleDark" aria-pressed="false" aria-label="Toggle dark mode">🌙</button>
      <a class="repo-link" href="https://github.com/Saumyajitroy75/memezone" target="_blank" rel="noopener">View on GitHub</a>
    </div>
  </header>

  <main>
    <div id="memeContainer" class="container" aria-live="polite"></div>
    <div id="loading">Loading more memes...</div>
    <noscript><div class="notice">JavaScript is required to load memes. Please enable JavaScript.</div></noscript>
  </main>

  <footer>
    <small>Made with ❤️ — Meme Zone</small>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
